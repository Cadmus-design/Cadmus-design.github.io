<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {

            max-width: 1000px;

        }
        
        .controls-grid {
            display: grid;

        .btn {

        .btn-warning {

        .status-panel {
            background: #343a40;
            color: #fff;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;

        .status-item {

        .status-label {

        .input-group {

            margin-bottom: 10px;

        .input-label {
            min-width: 100px;

        .input-field {

        }
        
        .quality-buttons {

        }
        
        .quality-btn {
            padding: 4px 8px;
            border: 2px solid #007bff;

            color: #007bff;

            cursor: pointer;

        }
        
        .quality-btn.active {
            background: #007bff;

        .log-container {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.3;
        }
        
        .config-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .bandwidth-indicator {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;

            margin-left: 5px;

        .bandwidth-excellent { background: #d4edda; color: #155724; }
        .bandwidth-good { background: #cce5ff; color: #0066cc; }
        .bandwidth-medium { background: #fff3cd; color: #856404; }
        .bandwidth-poor { background: #f8d7da; color: #721c24; }
        
        .subtitle-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .error-message {

            margin: 10px 0;
        }
        
        .success-message {

            padding: 10px;

            margin: 10px 0;
        }
        .box{
            display: flex;
        }
        .box .container{
            flex:1;
        }
    </style>
</head>
<body>
    <h1>🎬 Mlytics VOD 真實播放器測試</h1>
    
    <!-- 配置區域 -->
    <div class="config-section">
        <h3>⚙️ 播放器配置</h3>
        <div class="input-group">
            <label class="input-label">HLS URL:</label>
            <input type="text" class="input-field" id="hlsUrl" 
                   value="https://1001667376421-cloudfront-6bcqknh5.d-apm.com/hls/c8b24f0b-b70a-4854-9d69-72058641f9e0.mkv/c8b24f0b-b70a-4854-9d69-72058641f9e0.m3u8">
        </div>
        <div class="input-group">
            <label class="input-label">Asset ID:</label>
            <input type="text" class="input-field" id="assetId" value="c8b24f0b-b70a-4854-9d69-72058641f9e0" readonly>
        </div>
        <div class="input-group">
            <label class="input-label">API Token:</label>
            <input type="password" class="input-field" id="apiToken" placeholder="輸入您的 Mlytics API Token">
        </div>
        <div style="margin-top: 15px;">
            <button class="btn btn-primary" onclick="initializePlayer()">🚀 初始化播放器</button>
            <button class="btn btn-secondary" onclick="extractAssetId()">🔍 從URL提取Asset ID</button>
        </div>
        <div id="messageArea"></div>
    </div>

    <!-- 播放器區域 -->
    <div class="container">
        <h2>📺 Mlytics VOD 播放器</h2>
        <div class="video-container">
            <video id="video" class="video-js vjs-theme-fantasy" controls preload="auto">
                <p class="vjs-no-js">
                    請啟用 JavaScript 以使用播放器
                    <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
                </p>
            </video>
        </div>
        
        <!-- 播放器控制 -->
        <div class="controls-grid">
            <!-- 基本控制 -->
            <div class="control-group">
                <h4>基本控制</h4>
                <button class="btn btn-success" onclick="playVideo()">▶️ 播放</button>
                <button class="btn btn-warning" onclick="pauseVideo()">⏸️ 暫停</button>
                <button class="btn btn-secondary" onclick="reloadVideo()">🔄 重新載入</button>
            </div>
            
            <!-- 畫質控制 -->
            <div class="control-group">
                <h4>畫質選擇</h4>
                <div class="quality-buttons" id="qualityButtons">
                    <button class="quality-btn" onclick="setQuality('auto')">自動</button>
                    <button class="quality-btn" onclick="setQuality('240')">240p</button>
                    <button class="quality-btn" onclick="setQuality('360')">360p</button>
                    <button class="quality-btn" onclick="setQuality('480')">480p</button>
                    <button class="quality-btn" onclick="setQuality('720')">720p</button>
                    <button class="quality-btn" onclick="setQuality('1080')">1080p</button>
                </div>
            </div>
            
            <!-- Preload 控制 -->
            <div class="control-group">
                <h4>Preload 控制</h4>
                <button class="btn btn-success" onclick="enablePreload()">✅ 啟用 Preload</button>
                <button class="btn btn-danger" onclick="disablePreload()">❌ 關閉 Preload</button>
                <button class="btn btn-secondary" onclick="checkPreloadStatus()">🔍 檢查狀態</button>
            </div>
            
            <!-- 字幕控制 -->
            <div class="control-group">
                <h4>字幕控制</h4>
                <div class="subtitle-controls">
                    <button class="btn btn-secondary" onclick="toggleSubtitle('off')">關閉</button>
                    <button class="btn btn-primary" onclick="toggleSubtitle('zh')">中文</button>
                    <button class="btn btn-primary" onclick="toggleSubtitle('en')">English</button>
                </div>
            </div>
            
            <!-- 測試功能 -->
            <div class="control-group">
                <h4>測試功能</h4>
                <button class="btn btn-primary" onclick="simulateBandwidthTest()">📊 頻寬測試</button>
                <button class="btn btn-warning" onclick="simulateBuffering()">⏳ 模擬緩衝</button>
                <button class="btn btn-danger" onclick="simulateNetworkIssue()">🌐 網路問題</button>
            </div>
            
            <!-- API 測試 -->
            <div class="control-group">
                <h4>API 測試</h4>
                <button class="btn btn-success" onclick="testAssetAPI()">🔗 測試 Asset API</button>
                <button class="btn btn-secondary" onclick="getPlayerInfo()">ℹ️ 播放器資訊</button>
                <button class="btn btn-primary" onclick="exportPlayerData()">💾 匯出資料</button>
            </div>
        </div>
    </div>
<div class="box">
    <!-- 即時狀態監控 -->
    <div class="container">
        <h2>📊 即時狀態監控</h2>
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">播放狀態:</span>
                <span class="status-value" id="playStatus">未初始化</span>
            </div>
            <div class="status-item">
                <span class="status-label">目前時間:</span>
                <span class="status-value" id="currentTime">00:00</span>
            </div>
            <div class="status-item">
                <span class="status-label">影片長度:</span>
                <span class="status-value" id="duration">00:00</span>
            </div>
            <div class="status-item">
                <span class="status-label">目前畫質:</span>
                <span class="status-value" id="currentQuality">未知</span>
            </div>
            <div class="status-item">
                <span class="status-label">緩衝區:</span>
                <span class="status-value" id="bufferInfo">-- 秒</span>
            </div>
            <div class="status-item">
                <span class="status-label">網路速度:</span>
                <span class="status-value" id="networkSpeed">檢測中... <span class="bandwidth-indicator bandwidth-medium">--</span></span>
            </div>
            <div class="status-item">
                <span class="status-label">Preload 狀態:</span>
                <span class="status-value" id="preloadStatus">未知</span>
            </div>
            <div class="status-item">
                <span class="status-label">字幕軌道:</span>
                <span class="status-value" id="subtitleStatus">無</span>
            </div>
        </div>
        
        <div style="margin-top: 15px;">
            <button class="btn btn-success" onclick="startMonitoring()">▶️ 開始監控</button>
            <button class="btn btn-danger" onclick="stopMonitoring()">⏹️ 停止監控</button>
            <button class="btn btn-secondary" onclick="clearLogs()">🗑️ 清除日誌</button>
        </div>
    </div>

    <!-- 執行日誌 -->
    <div class="container">
        <h2>📝 執行日誌與除錯資訊</h2>
        <div class="log-container" id="logContainer">
            <div style="color: #4299e1;">🚀 Mlytics VOD 測試頁面已載入</div>
            <div style="color: #68d391;">✅ VideoJS 和 Mlytics SDK 已載入</div>
            <div style="color: #fbd38d;">⚠️ 請設定 HLS URL 後點擊 "初始化播放器"</div>
        </div>
    </div>
</div>
    <script>
        // 全域變數
        let videojsPlayer = null;
        let mlyticsDriver = null;
        let adapter = null;
        let monitoringInterval = null;
        let bandwidthTestInterval = null;
        let currentAssetId = null;
        let playerStats = {
            playTime: 0,
            bufferEvents: 0,
            qualityChanges: 0,
            errors: 0
        };

        // 日誌功能
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#4299e1',
                success: '#68d391',
                warning: '#fbd38d',
                error: '#fc8181',
                debug: '#a0aec0'
            };
            
            const logEntry = document.createElement('div');
            logEntry.style.color = colors[type] || colors.info;
            logEntry.innerHTML = `<span style="color: #a0aec0;">[${timestamp}]</span> ${message}`;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
            log('日誌已清除', 'info');
        }

        function showMessage(message, type = 'info') {
            const messageArea = document.getElementById('messageArea');
            const className = type === 'error' ? 'error-message' : 'success-message';
            messageArea.innerHTML = `<div class="${className}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        // Asset ID 提取
        function extractAssetId() {
            const hlsUrl = document.getElementById('hlsUrl').value;
            if (!hlsUrl) {
                showMessage('請先輸入 HLS URL', 'error');
                return;
            }
            
            try {
                const urlParts = hlsUrl.split('/');
                const hlsIndex = urlParts.findIndex(part => part === 'hls');
                
                if (hlsIndex !== -1 && urlParts[hlsIndex + 1]) {
                    const assetWithExt = urlParts[hlsIndex + 1];
                    const assetId = assetWithExt.split('.')[0];
                    
                    document.getElementById('assetId').value = assetId;
                    currentAssetId = assetId;
                    
                    log(`Asset ID 已提取: ${assetId}`, 'success');
                    showMessage(`Asset ID 已成功提取: ${assetId}`, 'success');
                } else {
                    throw new Error('無法從 URL 中找到 Asset ID');
                }
            } catch (error) {
                log(`Asset ID 提取失敗: ${error.message}`, 'error');
                showMessage(`提取失敗: ${error.message}`, 'error');
            }
        }

        // 初始化播放器
        function initializePlayer() {
            const hlsUrl = document.getElementById('hlsUrl').value;
            const assetId = document.getElementById('assetId').value;
            
            if (!hlsUrl) {
                showMessage('請輸入 HLS URL', 'error');
                return;
            }
            
            try {
                log('開始初始化 Mlytics 播放器...', 'info');
                
                // 如果已有播放器，先銷毀
                if (videojsPlayer) {
                    videojsPlayer.dispose();
                    log('已銷毀舊的播放器實例', 'debug');
                }
                
                // 初始化 Mlytics Driver
                mlyticsDriver = mlysdk.driver.initialize();
                log('Mlytics Driver 初始化完成', 'success');
                
                // 取得 video 元素
                const video = document.getElementById('video');
                
                // 建立 VideoJS 播放器與 Mlytics 整合
                adapter = mlyticsDriver.extensions.VideojsHlsPlayerPlugin.create(video, {
                    autoplay: false,
                    controls: true,
                    responsive: true,
                    fluid: true,
                    preload: 'auto',
                    sources: [{
                        src: hlsUrl,
                        type: 'application/vnd.apple.mpegurl'
                    }],
                    techOrder: ['html5'],
                    html5: {
                        vhs: {
                            overrideNative: true
                        }
                    }
                });
                
                videojsPlayer = adapter.player;
                currentAssetId = assetId;
                
                log(`播放器初始化完成，Asset ID: ${assetId}`, 'success');
                showMessage('播放器初始化成功！', 'success');
                
                // 設定播放器事件監聽
                setupPlayerEvents();
                
                // 更新狀態
                updatePlayerStatus();
                
            } catch (error) {
                log(`播放器初始化失敗: ${error.message}`, 'error');
                showMessage(`初始化失敗: ${error.message}`, 'error');
                console.error('播放器初始化錯誤:', error);
            }
        }

        // 設定播放器事件
        function setupPlayerEvents() {
            if (!videojsPlayer) return;
            
            videojsPlayer.ready(function() {
                log('播放器準備就緒', 'success');
                document.getElementById('playStatus').textContent = '準備就緒';
            });
            
            videojsPlayer.on('loadstart', function() {
                log('開始載入影片', 'info');
                document.getElementById('playStatus').textContent = '載入中...';
            });
            
            videojsPlayer.on('canplay', function() {
                log('影片可以開始播放', 'success');
                document.getElementById('playStatus').textContent = '可播放';
            });
            
            videojsPlayer.on('play', function() {
                log('影片開始播放', 'success');
                document.getElementById('playStatus').textContent = '播放中';
                playerStats.playTime = Date.now();
            });
            
            videojsPlayer.on('pause', function() {
                log('影片已暫停', 'info');
                document.getElementById('playStatus').textContent = '已暫停';
            });
            
            videojsPlayer.on('waiting', function() {
                log('影片緩衝中...', 'warning');
                document.getElementById('playStatus').textContent = '緩衝中';
                playerStats.bufferEvents++;
            });
            
            videojsPlayer.on('playing', function() {
                log('影片恢復播放', 'success');
                document.getElementById('playStatus').textContent = '播放中';
            });
            
            videojsPlayer.on('ended', function() {
                log('影片播放結束', 'info');
                document.getElementById('playStatus').textContent = '播放結束';
            });
            
            videojsPlayer.on('error', function(error) {
                log(`播放器錯誤: ${error.message || '未知錯誤'}`, 'error');
                document.getElementById('playStatus').textContent = '錯誤';
                playerStats.errors++;
            });
            
            videojsPlayer.on('timeupdate', function() {
                updateTimeDisplay();
            });
            
            videojsPlayer.on('durationchange', function() {
                updateTimeDisplay();
            });
            
            // 畫質變化監聽
            videojsPlayer.on('qualitychange', function(e) {
                const quality = videojsPlayer.currentResolution ? videojsPlayer.currentResolution() : '自動';
                log(`畫質已變更為: ${quality}`, 'info');
                document.getElementById('currentQuality').textContent = quality;
                playerStats.qualityChanges++;
                updateQualityButtons(quality);
            });
        }

        // 更新時間顯示
        function updateTimeDisplay() {
            if (!videojsPlayer) return;
            
            const currentTime = videojsPlayer.currentTime() || 0;
            const duration = videojsPlayer.duration() || 0;
            
            document.getElementById('currentTime').textContent = formatTime(currentTime);
            document.getElementById('duration').textContent = formatTime(duration);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 播放控制
        function playVideo() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            videojsPlayer.play();
            log('執行播放指令', 'info');
        }

        function pauseVideo() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            videojsPlayer.pause();
            log('執行暫停指令', 'info');
        }

        function reloadVideo() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            videojsPlayer.load();
            log('重新載入影片', 'info');
        }

        // 畫質控制
        function setQuality(quality) {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            try {
                if (quality === 'auto') {
                    // 啟用自動畫質選擇
                    if (videojsPlayer.vhs && videojsPlayer.vhs.representations) {
                        videojsPlayer.vhs.representations().forEach(rep => {
                            rep.enabled(true);
                        });
                    }
                    log('已切換至自動畫質選擇', 'info');
                } else {
                    // 設定特定畫質
                    const targetHeight = parseInt(quality);
                    if (videojsPlayer.vhs && videojsPlayer.vhs.representations) {
                        videojsPlayer.vhs.representations().forEach(rep => {
                            rep.enabled(rep.height === targetHeight);
                        });
                        log(`已切換至 ${quality}p 畫質`, 'info');
                    }
                }
                
                updateQualityButtons(quality);
                
            } catch (error) {
                log(`畫質切換失敗: ${error.message}`, 'error');
            }
        }

        function updateQualityButtons(activeQuality) {
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 找到對應的按鈕並標記為活躍
            const activeBtn = Array.from(document.querySelectorAll('.quality-btn'))
                .find(btn => btn.textContent.includes(activeQuality) || 
                      (activeQuality === 'auto' && btn.textContent === '自動'));
            
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
        }

        // Preload 控制
        function enablePreload() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            try {
                const videoElement = videojsPlayer.el().querySelector('video');
                if (videoElement) {
                    videoElement.preload = 'auto';
                    document.getElementById('preloadStatus').textContent = '已啟用';
                    log('Preload 已啟用', 'success');
                }
            } catch (error) {
                log(`啟用 Preload 失敗: ${error.message}`, 'error');
            }
        }

        function disablePreload() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            try {
                const videoElement = videojsPlayer.el().querySelector('video');
                if (videoElement) {
                    videoElement.preload = 'none';
                    document.getElementById('preloadStatus').textContent = '已關閉';
                    log('Preload 已關閉', 'success');
                }
            } catch (error) {
                log(`關閉 Preload 失敗: ${error.message}`, 'error');
            }
        }

        function checkPreloadStatus() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            try {
                const videoElement = videojsPlayer.el().querySelector('video');
                if (videoElement) {
                    const preloadValue = videoElement.preload || 'none';
                    document.getElementById('preloadStatus').textContent = preloadValue;
                    log(`Preload 狀態: ${preloadValue}`, 'info');
                }
            } catch (error) {
                log(`檢查 Preload 狀態失敗: ${error.message}`, 'error');
            }
        }

        // 字幕控制
        function toggleSubtitle(language) {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            try {
                const textTracks = videojsPlayer.textTracks();
                
                // 關閉所有字幕
                for (let i = 0; i < textTracks.length; i++) {
                    textTracks[i].mode = 'hidden';
                }
                
                if (language !== 'off') {
                    // 啟用指定語言字幕
                    for (let i = 0; i < textTracks.length; i++) {
                        if (textTracks[i].language === language) {
                            textTracks[i].mode = 'showing';
                            break;
                        }
                    }
                    document.getElementById('subtitleStatus').textContent = language;
                    log(`已啟用 ${language} 字幕`, 'success');
                } else {
                    document.getElementById('subtitleStatus').textContent = '關閉';
                    log('已關閉字幕', 'info');
                }
                
            } catch (error) {
                log(`字幕控制失敗: ${error.message}`, 'error');
            }
        }

        // 頻寬測試
        function simulateBandwidthTest() {
            log('開始頻寬測試...', 'info');
            
            let testProgress = 0;
            const testInterval = setInterval(() => {
                testProgress += 10;
                
                if (testProgress <= 100) {
                    const simulatedSpeed = Math.random() * 15 + 5; // 5-20 Mbps
                    const indicator = getBandwidthIndicator(simulatedSpeed);
                    
                    document.getElementById('networkSpeed').innerHTML = 
                        `${simulatedSpeed.toFixed(1)} Mbps <span class="bandwidth-indicator ${indicator.class}">${indicator.text}</span>`;
                    
                    log(`頻寬測試進度: ${testProgress}% - 檢測到 ${simulatedSpeed.toFixed(1)} Mbps`, 'info');
                } else {
                    clearInterval(testInterval);
                    log('頻寬測試完成', 'success');
                }
            }, 500);
        }

        function getBandwidthIndicator(speed) {
            if (speed >= 15) return { class: 'bandwidth-excellent', text: '優秀' };
            if (speed >= 10) return { class: 'bandwidth-good', text: '良好' };
            if (speed >= 5) return { class: 'bandwidth-medium', text: '一般' };
            return { class: 'bandwidth-poor', text: '較差' };
        }

        // 模擬緩衝
        function simulateBuffering() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            log('模擬緩衝事件...', 'warning');
            videojsPlayer.trigger('waiting');
            
            setTimeout(() => {
                videojsPlayer.trigger('playing');
                log('緩衝模擬結束', 'success');
            }, 3000);
        }

        // 模擬網路問題
        function simulateNetworkIssue() {
            log('模擬網路連線問題...', 'error');
            
            if (videojsPlayer) {
                videojsPlayer.pause();
                videojsPlayer.trigger('error');
            }
            
            setTimeout(() => {
                log('網路問題模擬結束，嘗試恢復播放...', 'info');
                if (videojsPlayer) {
                    videojsPlayer.load();
                }
            }, 5000);
        }

        // API 測試
        async function testAssetAPI() {
            const assetId = document.getElementById('assetId').value;
            const apiToken = document.getElementById('apiToken').value;
            
            if (!assetId) {
                showMessage('請提供 Asset ID', 'error');
                return;
            }
            
            if (!apiToken) {
                showMessage('請提供 API Token 以進行 API 測試', 'error');
                log('跳過 API 測試：未提供 API Token', 'warning');
                return;
            }
            
            try {
                log(`測試 Asset API，Asset ID: ${assetId}`, 'info');
                
                const response = await fetch(
                    `https://api.mlytics.com/v2/vod/transcoder/vod-asset/${assetId}`,
                    {
                        headers: {
                            'Authorization': `Bearer ${apiToken}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );
                
                if (response.ok) {
                    const assetData = await response.json();
                    log('Asset API 測試成功', 'success');
                    log(`Asset 狀態: ${assetData.status || '未知'}`, 'info');
                    showMessage('Asset API 測試成功！', 'success');
                } else {
                    throw new Error(`API 請求失敗: ${response.status} ${response.statusText}`);
                }
                
            } catch (error) {
                log(`Asset API 測試失敗: ${error.message}`, 'error');
                showMessage(`API 測試失敗: ${error.message}`, 'error');
            }
        }

        function getPlayerInfo() {
            if (!videojsPlayer) {
                showMessage('請先初始化播放器', 'error');
                return;
            }
            
            try {
                const info = {
                    currentTime: videojsPlayer.currentTime(),
                    duration: videojsPlayer.duration(),
                    paused: videojsPlayer.paused(),
                    volume: videojsPlayer.volume(),
                    playbackRate: videojsPlayer.playbackRate(),
                    buffered: videojsPlayer.buffered(),
                    networkState: videojsPlayer.networkState ? videojsPlayer.networkState() : 'N/A',
                    readyState: videojsPlayer.readyState ? videojsPlayer.readyState() : 'N/A'
                };
                
                log('=== 播放器資訊 ===', 'info');
                log(`目前時間: ${formatTime(info.currentTime)}`, 'debug');
                log(`影片長度: ${formatTime(info.duration)}`, 'debug');
                log(`播放狀態: ${info.paused ? '暫停' : '播放中'}`, 'debug');
                log(`音量: ${(info.volume * 100).toFixed(0)}%`, 'debug');
                log(`播放速度: ${info.playbackRate}x`, 'debug');
                log(`網路狀態: ${info.networkState}`, 'debug');
                log(`準備狀態: ${info.readyState}`, 'debug');
                log('==================', 'info');
                
            } catch (error) {
                log(`取得播放器資訊失敗: ${error.message}`, 'error');
            }
        }

        function exportPlayerData() {
            const exportData = {
                timestamp: new Date().toISOString(),
                assetId: currentAssetId,
                hlsUrl: document.getElementById('hlsUrl').value,
                playerStats: playerStats,
                currentStatus: {
                    playStatus: document.getElementById('playStatus').textContent,
                    currentTime: document.getElementById('currentTime').textContent,
                    duration: document.getElementById('duration').textContent,
                    currentQuality: document.getElementById('currentQuality').textContent,
                    networkSpeed: document.getElementById('networkSpeed').textContent,
                    preloadStatus: document.getElementById('preloadStatus').textContent,
                    subtitleStatus: document.getElementById('subtitleStatus').textContent
                }
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mlytics-player-data-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            log('播放器資料已匯出', 'success');
        }

        // 狀態監控
        function startMonitoring() {
            if (monitoringInterval) {
                log('監控已在執行中', 'warning');
                return;
            }
            
            log('開始即時狀態監控', 'info');
            monitoringInterval = setInterval(updatePlayerStatus, 1000);
        }

        function stopMonitoring() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
                log('即時監控已停止', 'info');
            }
        }

        function updatePlayerStatus() {
            if (!videojsPlayer) return;
            
            try {
                // 更新緩衝區資訊
                const buffered = videojsPlayer.buffered();
                if (buffered.length > 0) {
                    const bufferEnd = buffered.end(buffered.length - 1);
                    const currentTime = videojsPlayer.currentTime();
                    const bufferLength = bufferEnd - currentTime;
                    document.getElementById('bufferInfo').textContent = `${bufferLength.toFixed(1)} 秒`;
                }
                
                // 更新其他狀態
                updateTimeDisplay();
                
            } catch (error) {
                // 忽略更新錯誤，避免日誌過多
            }
        }

        // 頁面載入時自動提取 Asset ID
        document.addEventListener('DOMContentLoaded', function() {
            log('頁面載入完成，準備就緒', 'success');
            
            // 自動從預設 URL 提取 Asset ID
            extractAssetId();
            
            // 檢查 VideoJS 和 Mlytics SDK 是否載入
            if (typeof videojs !== 'undefined') {
                log('VideoJS 載入成功', 'success');
            } else {
                log('VideoJS 載入失敗', 'error');
            }
            
            if (typeof mlysdk !== 'undefined') {
                log('Mlytics SDK 載入成功', 'success');
            } else {
                log('Mlytics SDK 載入失敗', 'error');
            }
            
            // 提示用戶可以開始測試
            showMessage('播放器測試頁面準備完成！點擊 "初始化播放器" 開始測試。', 'success');
        });

        // 錯誤處理
        window.addEventListener('error', function(event) {
            log(`全域錯誤: ${event.error.message}`, 'error');
        });

        // 防止頁面意外關閉時丟失測試資料
        window.addEventListener('beforeunload', function(event) {
            if (videojsPlayer && !videojsPlayer.paused()) {
                event.preventDefault();
                event.returnValue = '播放器正在運行中，確定要離開頁面嗎？';
            }
        });
    </script>
</body>
</html>
