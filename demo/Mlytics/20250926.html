<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://vjs.fusioncdn.com/8.9.0/video-js.min.css" rel="stylesheet">
  <link href="https://unpkg.com/@videojs/themes@1/dist/fantasy/index.css" rel="stylesheet">
  <script src="https://vjs.fusioncdn.com/8.9.0/video.min.js"></script>
  <!-- Configuration might be different along with Stream. -->
  <script src="https://sdkjs.fusioncdn.com/d37tujhk34aogifb85m0-mlysdk.js"></script>
  <script src="https://jsdelivr.fusioncdn.com/npm/@mlytics/p2sp-sdk@latest/bundle/driver.min.js"></script>
  <script
    src="https://jsdelivr.fusioncdn.com/npm/@mlytics/p2sp-sdk@latest/bundle/peripheral/player/videojs-hls.min.js"></script>
</head>

<body>
  <div style="width: 100%; height: auto; aspect-ratio: 16 / 9">
    <video id="video" class="video-js vjs-theme-fantasy"
      style="width: 100%; height: auto; aspect-ratio: 16 / 9; background-color: black;"></video>
  </div>
  <script>
    const driver = mlysdk.driver.initialize()

    const src = "https://1001757344507-cloudfront-sec5a7b4.d-apm.com/hls/06660ef1-308a-49c0-9eb5-231a67808a1c.mp4/06660ef1-308a-49c0-9eb5-231a67808a1c.m3u8"
    const video = document.getElementById('video')
    const adapter = driver.extensions.VideojsHlsPlayerPlugin.create(video, {
      autoplay: false,
      controls: true,
      preload: none,
      playbackRates: [0.5, 1, 1.5, 2],
      disablePictureInPicture: true,
      sources: [{
        src,
        type: 'application/vnd.apple.mpegurl'
      }],
      tracks: [{
        src: 'example.vtt',
        kind: 'subtitles',
        srclang: 'en',
        label: 'English',
        default: true,
      }]
    })
    const videojsPlayer = adapter.player
  </script>
</body>

</html>
