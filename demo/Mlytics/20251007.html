<script>
    let driver = null;
    let adapter = null;
    let videojsPlayer = null;
    
    const src = "https://1001667376421-cloudfront-6bcqknh5.d-apm.com/hls/c8b24f0b-b70a-4854-9d69-72058641f9e0.mkv/c8b24f0b-b70a-4854-9d69-72058641f9e0.m3u8";
    
    function initializePlayer() {
        if (videojsPlayer) return;
        
        const video = document.getElementById('video');
        driver = mlysdk.driver.initialize();
        
        adapter = driver.extensions.VideojsHlsPlayerPlugin.create(video, {
            autoplay: true,
            controls: true,
            sources: [{
                src,
                type: 'application/vnd.apple.mpegurl'
            }]
        });
        
        videojsPlayer = adapter.player;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('video');
        video.addEventListener('click', initializePlayer);
    });
</script>
</body>
